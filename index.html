<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SK Professional Invoice</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:15px;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
}

.container{
  max-width:650px;
  margin:auto;
  background:#1e293b;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

h1{
  text-align:center;
  font-size:34px;
  margin:5px 0;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  margin-bottom:25px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:7px;
  font-size:17px;
}

input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#334155;
  color:white;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.calculate{
  background:#22c55e;
}

.print{
  background:#3b82f6;
}

.download{
  background:#8b5cf6;
}

.clear{
  background:#ef4444;
}

.invoice{
  margin-top:25px;
  background:white;
  color:#111827;
  padding:25px;
  border-radius:15px;
}

.invoice-header{
  text-align:center;
  border-bottom:2px solid #111827;
  padding-bottom:15px;
  margin-bottom:15px;
}

.invoice-header h2{
  margin:0;
  font-size:30px;
}

.invoice-info{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.info-box{
  flex:1;
}

.info-box p{
  margin:7px 0;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:11px 0;
  border-bottom:1px solid #ddd;
}

.total{
  font-size:22px;
  font-weight:bold;
  border-bottom:none;
  margin-top:5px;
}

.footer{
  text-align:center;
  margin-top:20px;
  font-size:13px;
  color:#64748b;
}

@media(max-width:500px){

  .container{
    padding:18px;
  }

  h1{
    font-size:30px;
  }

  .invoice{
    padding:18px;
  }

  .invoice-info{
    display:block;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>🧾 SK Invoice</h1>

<p class="subtitle">Professional Invoice Generator</p>

<label>Customer Name</label>
<input type="text" id="customer" placeholder="Example: Rahul">

<label>Invoice Number</label>
<input type="text" id="invoiceNo" placeholder="Example: SK-001">

<label>Date</label>
<input type="date" id="date">

<label>Item Name</label>
<input type="text" id="item" placeholder="Example: T-Shirt">

<label>Price (₹)</label>
<input type="number" id="price" placeholder="500">

<label>Quantity</label>
<input type="number" id="quantity" value="1">

<label>GST (%)</label>
<input type="number" id="gst" value="18">

<button class="calculate" onclick="calculateInvoice()">
Calculate Invoice
</button>

<button class="print" onclick="printInvoice()">
🖨️ Print Invoice
</button>

<button class="download" onclick="downloadInvoice()">
⬇️ Download Invoice
</button>

<button class="clear" onclick="clearInvoice()">
🧹 Clear
</button>


<div class="invoice" id="invoice">

<div class="invoice-header">
<h2>SK INVOICE</h2>
<p>Professional Invoice</p>
</div>


<div class="invoice-info">

<div class="info-box">

<p>
<b>Customer:</b>
<span id="showCustomer">-</span>
</p>

<p>
<b>Invoice No:</b>
<span id="showInvoiceNo">-</span>
</p>

</div>


<div class="info-box">

<p>
<b>Date:</b>
<span id="showDate">-</span>
</p>

</div>

</div>


<div class="row">
<span>Item</span>
<span id="showItem">-</span>
</div>

<div class="row">
<span>Price</span>
<span>₹<span id="showPrice">0.00</span></span>
</div>

<div class="row">
<span>Quantity</span>
<span id="showQuantity">0</span>
</div>

<div class="row">
<span>Subtotal</span>
<span>₹<span id="subtotal">0.00</span></span>
</div>

<div class="row">
<span>GST</span>
<span>₹<span id="gstAmount">0.00</span></span>
</div>

<div class="row total">
<span>Total</span>
<span>₹<span id="total">0.00</span></span>
</div>


<div class="footer">
Thank you for your business!<br>
Generated by SK Invoice Calculator
</div>

</div>

</div>


<script>

function calculateInvoice(){

  let customer =
  document.getElementById("customer").value;

  let invoiceNo =
  document.getElementById("invoiceNo").value;

  let date =
  document.getElementById("date").value;

  let item =
  document.getElementById("item").value;

  let price =
  Number(document.getElementById("price").value);

  let quantity =
  Number(document.getElementById("quantity").value);

  let gst =
  Number(document.getElementById("gst").value);


  if(
    !customer ||
    !invoiceNo ||
    !item ||
    price <= 0 ||
    quantity <= 0
  ){

    alert("Please enter all required details.");

    return;
  }


  let subtotal = price * quantity;

  let gstAmount = subtotal * gst / 100;

  let total = subtotal + gstAmount;


  document.getElementById("showCustomer").innerText =
  customer;

  document.getElementById("showInvoiceNo").innerText =
  invoiceNo;

  document.getElementById("showDate").innerText =
  date || new Date().toLocaleDateString();

  document.getElementById("showItem").innerText =
  item;

  document.getElementById("showPrice").innerText =
  price.toFixed(2);

  document.getElementById("showQuantity").innerText =
  quantity;

  document.getElementById("subtotal").innerText =
  subtotal.toFixed(2);

  document.getElementById("gstAmount").innerText =
  gstAmount.toFixed(2);

  document.getElementById("total").innerText =
  total.toFixed(2);
}


function printInvoice(){

  calculateInvoice();

  let invoice =
  document.getElementById("invoice").innerHTML;

  let newWindow =
  window.open("", "", "width=700,height=800");


  newWindow.document.write(`

  <html>

  <head>

  <title>SK Invoice</title>

  <style>

  body{
    font-family:Arial;
    padding:30px;
    color:#111827;
  }

  .invoice-header{
    text-align:center;
    border-bottom:2px solid #111827;
    padding-bottom:15px;
  }

  .invoice-info{
    display:flex;
    justify-content:space-between;
    margin:20px 0;
  }

  .row{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #ddd;
  }

  .total{
    font-size:22px;
    font-weight:bold;
  }

  .footer{
    text-align:center;
    margin-top:25px;
  }

  </style>

  </head>

  <body>

  ${invoice}

  </body>

  </html>

  `);

  newWindow.document.close();

  newWindow.print();
}


function downloadInvoice(){

  calculateInvoice();


  let customer =
  document.getElementById("showCustomer").innerText;

  let invoiceNo =
  document.getElementById("showInvoiceNo").innerText;

  let date =
  document.getElementById("showDate").innerText;

  let item =
  document.getElementById("showItem").innerText;

  let price =
  document.getElementById("showPrice").innerText;

  let quantity =
  document.getElementById("showQuantity").innerText;

  let subtotal =
  document.getElementById("subtotal").innerText;

  let gst =
  document.getElementById("gstAmount").innerText;

  let total =
  document.getElementById("total").innerText;


  let text = `

SK INVOICE
==============================

Customer: ${customer}

Invoice Number: ${invoiceNo}

Date: ${date}

------------------------------

Item: ${item}

Price: ₹${price}

Quantity: ${quantity}

Subtotal: ₹${subtotal}

GST: ₹${gst}

TOTAL: ₹${total}

==============================

Thank you for your business!

Generated by SK Invoice Calculator

`;


  let blob =
  new Blob([text], {
    type:"text/plain"
  });


  let url =
  URL.createObjectURL(blob);


  let a =
  document.createElement("a");

  a.href = url;

  a.download =
  "SK-Invoice-" + invoiceNo + ".txt";

  a.click();


  URL.revokeObjectURL(url);
}


function clearInvoice(){

  document.getElementById("customer").value = "";

  document.getElementById("invoiceNo").value = "";

  document.getElementById("date").value = "";

  document.getElementById("item").value = "";

  document.getElementById("price").value = "";

  document.getElementById("quantity").value = "1";

  document.getElementById("gst").value = "18";


  document.getElementById("showCustomer").innerText = "-";

  document.getElementById("showInvoiceNo").innerText = "-";

  document.getElementById("showDate").innerText = "-";

  document.getElementById("showItem").innerText = "-";

  document.getElementById("showPrice").innerText = "0.00";

  document.getElementById("showQuantity").innerText = "0";

  document.getElementById("subtotal").innerText = "0.00";

  document.getElementById("gstAmount").innerText = "0.00";

  document.getElementById("total").innerText = "0.00";
}

</script>

</body>
</html>
